---
- name: Ensure an OceanBase cluster exists
  hosts: localhost
  gather_facts: false
  vars:
    ocp_connection: &ocp_connection
      base_url: "{{ lookup('env', 'OCP_URL') }}"
      access_key: "{{ lookup('env', 'OCP_ACCESS_KEY') }}"
      secret_key: "{{ lookup('env', 'OCP_SECRET_KEY') }}"
    cluster_name: staging
    cluster_definition: {}
  tasks:
    - name: Create the cluster using the target OCP version's native schema
      oceanbase.ocp.ocp_cluster:
        <<: *ocp_connection
        name: "{{ cluster_name }}"
        definition: "{{ cluster_definition }}"
        wait: true
        wait_timeout: 1800
      no_log: true
